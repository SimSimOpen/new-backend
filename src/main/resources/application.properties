spring.application.name=simsim

spring.datasource.url=jdbc:postgresql://localhost:5432/sim-sim
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql = true

# root application.properties
# application-local.properties is gitignored; see application-local.properties.example.
# It is listed last so its values win over the imports and the defaults below.
spring.config.import=optional:classpath:application-minio.properties,optional:classpath:application-auth-db.properties,optional:classpath:application-local.properties

server.port=8080

jwt.secret=${JWT_SECRET:}

minio.url=${MINIO_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:}
minio.secretKey=${MINIO_SECRET_KEY:}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.media.base-url=${APP_MEDIA_BASE_URL:http://localhost:9000}

# the local redis container runs without auth; set SPRING_DATA_REDIS_USERNAME / SPRING_DATA_REDIS_PASSWORD for a secured one
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 'log' prints the OTP instead of texting it; 'twilio' requires the twilio.* credentials
app.sms.provider=${SMS_PROVIDER:log}

# explicit placeholders: Spring's env-var form of twilio.account-sid is TWILIO_ACCOUNTSID,
# so relying on relaxed binding would silently leave these empty in a container
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.trial-number=${TWILIO_TRIAL_NUMBER:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.max-http-request-header-size=50MB
spring.threads.virtual.enabled=true

app.admin.username=admin
app.admin.email=jimishukurow@gmail.com
app.admin.password=${APP_ADMIN_PASSWORD:}