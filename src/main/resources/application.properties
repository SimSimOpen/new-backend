spring.application.name=simsim

spring.datasource.url=jdbc:postgresql://localhost:5432/sim-sim
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql = true

# root application.properties
# application-local.properties is gitignored; see application-local.properties.example.
# It is listed last so its values win over the imports and the defaults below.
spring.config.import=optional:classpath:application-minio.properties,optional:classpath:application-auth-db.properties,optional:classpath:application-local.properties

server.port=8080

jwt.secret=${JWT_SECRET:}

minio.url=${MINIO_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:}
minio.secretKey=${MINIO_SECRET_KEY:}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.media.base-url=${APP_MEDIA_BASE_URL:http://localhost:9000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.max-http-request-header-size=50MB
spring.threads.virtual.enabled=true

app.admin.username=admin
app.admin.email=jimishukurow@gmail.com
app.admin.password=${APP_ADMIN_PASSWORD:}