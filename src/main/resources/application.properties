spring.application.name=simsim

spring.datasource.url=jdbc:postgresql://localhost:5432/sim-sim
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql = true

# root application.properties
# application-local.properties is gitignored; see application-local.properties.example.
# It is listed last so its values win over the imports and the defaults below.
spring.config.import=optional:classpath:application-minio.properties,optional:classpath:application-auth-db.properties,optional:classpath:application-local.properties

server.port=8080

jwt.secret=${JWT_SECRET:}

minio.url=${MINIO_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:}
minio.secretKey=${MINIO_SECRET_KEY:}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.media.base-url=${APP_MEDIA_BASE_URL:http://localhost:9000}

# the local redis container runs without auth; set SPRING_DATA_REDIS_USERNAME / SPRING_DATA_REDIS_PASSWORD for a secured one
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 'log' prints the OTP instead of texting it; 'twilio' requires the twilio.* credentials
app.sms.provider=${SMS_PROVIDER:log}

# explicit placeholders: Spring's env-var form of twilio.account-sid is TWILIO_ACCOUNTSID,
# so relying on relaxed binding would silently leave these empty in a container
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.trial-number=${TWILIO_TRIAL_NUMBER:}

# --- operator notification feed (drop-in net.jemsit.notify module) ---
# Fail closed on both counts. With neither NOTIFY_ENABLED nor NOTIFY_TOKEN in the server .env, the
# module's auto-configuration is skipped entirely: no beans, no notify_outbox / notify_device tables,
# no /notify/** mappings. Enable by adding BOTH to the ENV_FILE repository secret in one edit; see
# .env.example.
#
# NOTIFY_ENABLED=true with an empty NOTIFY_TOKEN is an open relay on a public hostname - POST
# /notify/publish would let anyone on the internet push a card to a phone that trusts this app.
# NotifyFailClosedEnvironmentPostProcessor forces enabled back to false in that case rather than
# letting it boot open.
#
# No committed token default here, unlike the blog: SimSimOpen/new-backend is public, and a fallback
# string in a public repo silently becomes the live production credential.
notify.enabled=${NOTIFY_ENABLED:true}
notify.token=${NOTIFY_TOKEN:simsim-default-token}

# Pinned rather than left to the module's own default so the literal exists exactly once. Three
# things must agree on this prefix and this is the only line defining it: the module's
# @RequestMapping, SecurityConfig's permitAll list, and JwtFilter.shouldNotFilter.
notify.base-path=/notify

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.max-http-request-header-size=50MB
spring.threads.virtual.enabled=true

app.admin.username=admin
app.admin.email=jimishukurow@gmail.com
app.admin.password=${APP_ADMIN_PASSWORD:}